name: Deploy Bingo Frontend to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # Build Next.js
      # ----------------------------------------
      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # ----------------------------------------
      # Prepare deployment
      # ----------------------------------------
      - name: Prepare deployment files
        run: |
          set -e

          rm -rf deploy deploy.tar.gz
          mkdir -p deploy

          echo "Copying standalone application..."
          cp -r .next/standalone/. deploy/

          echo "Copying Next.js static files..."
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          echo "Copying public files..."
          if [ -d "public" ]; then
            mkdir -p deploy/public
            cp -r public/. deploy/public/
          fi

          echo "Checking server.js..."
          test -f deploy/server.js

          echo "Creating deployment archive..."
          tar -czf deploy.tar.gz -C deploy .

          echo "Deployment archive:"
          ls -lh deploy.tar.gz

      # ----------------------------------------
      # Test SSH connection
      # ----------------------------------------
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            whoami
            pwd
            echo "SSH connection successful"

      # ----------------------------------------
      # Upload deployment archive
      # ----------------------------------------
      - name: Upload deployment archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy.tar.gz
          target: /home/axumbiew/
          overwrite: true

      # ----------------------------------------
      # Deploy
      # ----------------------------------------
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            APP_DIR="/home/axumbiew/type.axumbingo.com"
            ARCHIVE="/home/axumbiew/deploy.tar.gz"

            echo "========================================"
            echo "Starting deployment"
            echo "========================================"

            # ----------------------------------------
            # Go to application directory
            # ----------------------------------------
            cd "$APP_DIR"

            # ----------------------------------------
            # Remove previous deployment
            # Keep .env and tmp
            # ----------------------------------------
            find . -mindepth 1 -maxdepth 1 \
              ! -name ".env" \
              ! -name "tmp" \
              -exec rm -rf {} +

            # ----------------------------------------
            # Extract new deployment
            # ----------------------------------------
            tar -xzf "$ARCHIVE"

            # ----------------------------------------
            # Remove archive
            # ----------------------------------------
            rm -f "$ARCHIVE"

            # ----------------------------------------
            # Activate cPanel Node environment
            # ----------------------------------------
            source /home/axumbiew/nodevenv/axumbingo.com/24/bin/activate

            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            # ----------------------------------------
            # Verify deployment
            # ----------------------------------------
            test -f server.js
            test -d .next

            echo "Deployment files:"
            ls -lah

            # ----------------------------------------
            # Restart Passenger
            # ----------------------------------------
            mkdir -p tmp
            touch tmp/restart.txt

            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"
